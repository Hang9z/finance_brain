<!-- 导入演示页面，用于上传文档并观察导入状态（Google NotebookLM 极简工作台风格） -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资料导入 · 金融智脑</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-surface: #ffffff;
            --bg-subtle: #f8fafd;
            --bg-container: #f0f4f9;
            --text-primary: #1f1f1f;
            --text-secondary: #444746;
            --text-muted: #747775;
            --google-blue: #0b57d0;
            --border-color: #e3e3e3;
            --font-sans: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-surface);
            color: var(--text-primary);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* 顶部应用栏：与问答页保持统一的 Google 工作台顶栏 */
        .topbar {
            height: 60px;
            padding: 0 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-surface);
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .topbar-brand strong {
            font-size: 17px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .topbar-divider {
            color: #c4c7c5;
            font-weight: 300;
        }

        .topbar-module {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* 主容器：左对齐现代控制台布局 */
        .container {
            width: 100%;
            max-width: 860px;
            margin: 0 auto;
            padding: 40px 24px 64px;
        }

        .header-wrap {
            margin-bottom: 28px;
        }

        h1 {
            font-size: 22px;
            font-weight: 500;
            color: var(--text-primary);
            margin: 0 0 8px 0;
            letter-spacing: -0.2px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }

        /* Google NotebookLM 风格上传区：干净克制，无艳丽背景 */
        .upload-area {
            border: 1px dashed #c4c7c5;
            background-color: var(--bg-subtle);
            border-radius: 16px;
            padding: 44px 32px;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        .upload-area:hover {
            background-color: var(--bg-container);
            border-color: var(--text-secondary);
        }

        .upload-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
        }

        .upload-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            margin: 0 0 6px 0;
        }

        .upload-hint {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0;
        }

        .file-input {
            display: none;
        }

        /* 任务列表区域 */
        .file-list {
            margin-top: 28px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .file-item {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            transition: border-color 0.15s ease;
        }

        .file-item:hover {
            border-color: #c4c7c5;
        }

        .file-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            margin-right: 20px;
            min-width: 0;
        }

        .file-name {
            font-weight: 500;
            font-size: 14px;
            color: var(--text-primary);
            word-break: break-all;
        }

        .file-size {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            font-variant-numeric: tabular-nums;
        }

        /* 状态标签 */
        .status-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            flex-shrink: 0;
        }

        .status-uploading {
            background-color: #fef7e0;
            color: #b06000;
        }

        .status-processing {
            background-color: #e8f0fe;
            color: #0b57d0;
        }

        .status-completed {
            background-color: #e6f4ea;
            color: #137333;
        }

        .status-error {
            background-color: #fce8e6;
            color: #c5221f;
        }

        /* 极细线性进度条 */
        .progress-bar-container {
            width: 100%;
            height: 4px;
            background-color: var(--bg-container);
            margin-top: 12px;
            border-radius: 999px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--google-blue);
            width: 0%;
            border-radius: 999px;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        /* 任务日志折叠栏 */
        .log-details {
            margin-top: 10px;
            font-size: 12.5px;
            color: var(--text-secondary);
        }

        .log-details summary {
            cursor: pointer;
            user-select: none;
            color: var(--text-muted);
            font-size: 12px;
            outline: none;
        }

        .log-details summary:hover {
            color: var(--text-primary);
        }

        .log-list {
            margin: 8px 0 0 0;
            padding: 8px 12px;
            list-style: none;
            background: var(--bg-subtle);
            border-radius: 8px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
        }

        .log-list li {
            margin: 4px 0;
            line-height: 1.5;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

<header class="topbar">
    <div class="topbar-brand">
        <svg width="20" height="20" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 28C14 21.75 9.52 14 0 14C9.52 14 14 6.25 14 0C14 6.25 18.48 14 28 14C18.48 14 14 21.75 14 28Z" fill="url(#g)"/>
            <defs>
                <linearGradient id="g" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#4285F4"/>
                    <stop offset="0.5" stop-color="#9B72CB"/>
                    <stop offset="1" stop-color="#D96570"/>
                </linearGradient>
            </defs>
        </svg>
        <strong>金融智脑</strong>
        <span class="topbar-divider">/</span>
        <span class="topbar-module">知识库文档导入</span>
    </div>
</header>

<div class="container">
    <div class="header-wrap">
        <h1>添加知识源文档</h1>
        <p class="subtitle">上传上市公司定期财报、基金招募说明书、银行理财风险揭示书或监管政策文件，系统将自动执行文本切片与向量索引。</p>
    </div>
    
    <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
        </div>
        <p class="upload-title">拖拽文件至此处，或点击选择本地文件</p>
        <p class="upload-hint">支持格式：PDF (.pdf)、Word (.docx / .doc)、Markdown (.md)</p>
        <input type="file" id="fileInput" class="file-input" multiple accept=".pdf,.md,.docx,.doc">
    </div>

    <div id="fileList" class="file-list">
        <!-- 文件列表将在这里生成 -->
    </div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    
    const API_BASE = location.origin.startsWith('http') ? location.origin : 'http://127.0.0.1:8000';

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '#f0f4f9';
        dropZone.style.borderColor = '#0b57d0';
    });

    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '';
        dropZone.style.borderColor = '';
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '';
        dropZone.style.borderColor = '';
        handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
        handleFiles(e.target.files);
    });

    function handleFiles(files) {
        Array.from(files).forEach(uploadFile);
    }

    function updateProgressBar(bar, percentage) {
        bar.style.width = percentage + '%';
        if (percentage >= 100) {
            bar.style.backgroundColor = '#137333';
        } else {
            bar.style.backgroundColor = '#0b57d0';
        }
    }

    async function uploadFile(file) {
        const id = 'file-' + Math.random().toString(36).substr(2, 9);
        const html = `
            <div class="file-item" id="${id}">
                <div class="file-info">
                    <span class="file-name">${file.name}</span>
                    <span class="file-size">${(file.size / 1024).toFixed(2)} KB</span>
                    <div class="progress-bar-container">
                        <div class="progress-bar"></div>
                    </div>
                    <details class="log-details">
                        <summary>查看处理日志</summary>
                        <ul class="log-list"></ul>
                    </details>
                </div>
                <div class="status-badge status-uploading">上传中</div>
            </div>
        `;
        fileList.insertAdjacentHTML('afterbegin', html);
        const itemEl = document.getElementById(id);
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressBar = itemEl.querySelector('.progress-bar');
        const progressContainer = itemEl.querySelector('.progress-bar-container');

        const formData = new FormData();
        formData.append('files', file);

        try {
            progressContainer.style.display = 'block';
            updateProgressBar(progressBar, 50);

            const response = await fetch(`${API_BASE}/upload`, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error('Upload failed');
            
            const result = await response.json();
            const taskId = result.task_ids[0];

            updateProgressBar(progressBar, 30);
            statusBadge.textContent = '索引中';
            statusBadge.className = 'status-badge status-processing';

            pollStatus(taskId, itemEl);

        } catch (error) {
            console.error(error);
            statusBadge.textContent = '失败';
            statusBadge.className = 'status-badge status-error';
        }
    }

    function normalizeDoneLog(text) {
        if (typeof text !== 'string') return String(text);
        return text.endsWith('已完成') ? text : `${text}已完成`;
    }

    function normalizeRunningLog(text) {
        if (typeof text !== 'string') return String(text);
        if (text.startsWith('正在进行')) return text.endsWith('...') ? text : `${text}...`;
        return `正在进行${text}...`;
    }

    function renderLogs(itemEl, doneList, runningList) {
        const logSummary = itemEl.querySelector('.log-details summary');
        const logListEl = itemEl.querySelector('.log-list');
        const logDetails = itemEl.querySelector('.log-details');

        const done = Array.isArray(doneList) ? doneList : [];
        const running = Array.isArray(runningList) ? runningList : [];

        logSummary.textContent = `处理日志（已完成 ${done.length}，进行中 ${running.length}）`;

        logListEl.innerHTML = '';
        const lines = [
            ...done.map(normalizeDoneLog),
            ...running.map(normalizeRunningLog),
        ];

        if (lines.length === 0) {
            const li = document.createElement('li');
            li.textContent = '暂无日志';
            logListEl.appendChild(li);
        } else {
            for (const line of lines) {
                const li = document.createElement('li');
                li.textContent = line;
                logListEl.appendChild(li);
            }
        }

        if (lines.length === 0) {
            logDetails.open = false;
        }
    }

    function pollStatus(taskId, itemEl) {
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressBar = itemEl.querySelector('.progress-bar');
        
        const interval = setInterval(async () => {
            try {
                const res = await fetch(`${API_BASE}/status/${taskId}`);
                const data = await res.json();

                renderLogs(itemEl, data.done_list, data.running_list);
                
                if (data.status === 'completed') {
                    statusBadge.textContent = '已完成';
                    statusBadge.className = 'status-badge status-completed';
                    updateProgressBar(progressBar, 100);
                    clearInterval(interval);
                } else if (data.status === 'processing') {
                    statusBadge.textContent = '索引中';
                    updateProgressBar(progressBar, 30);
                } else if (data.status === 'failed') {
                    statusBadge.textContent = '失败';
                    statusBadge.className = 'status-badge status-error';
                    clearInterval(interval);
                }
            } catch (e) {
                console.error('Polling error', e);
            }
        }, 2000);
    }
</script>

</body>
</html>
