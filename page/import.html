<!-- 导入演示页面，用于上传文档并观察导入状态（Google Workspace / Gemini 风格重制版） -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金融知识库资料导入中心</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #f0f4f9;
            --bg-card: #ffffff;
            --text-primary: #1f1f1f;
            --text-secondary: #444746;
            --text-muted: #747775;
            --google-blue: #0b57d0;
            --google-blue-bg: #f8fafd;
            --border-subtle: #e3e3e3;
            --gemini-gradient: linear-gradient(135deg, #4285f4 0%, #9b72cb 50%, #d96570 100%);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Noto Sans SC', "Google Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            margin: 0;
            padding: 48px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 780px;
            background-color: var(--bg-card);
            padding: 40px 44px;
            border-radius: 28px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            align-self: flex-start;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(66,133,244,0.1), rgba(155,114,203,0.1));
            color: var(--google-blue);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .header-wrap {
            text-align: center;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 26px;
            font-weight: 600;
            margin: 0 0 10px 0;
            letter-spacing: -0.3px;
            background: linear-gradient(90deg, #1f1f1f 0%, #0b57d0 55%, #9b72cb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }

        /* Google Drive / NotebookLM 风格上传区 */
        .upload-area {
            border: 2px dashed #c2e7ff;
            background-color: var(--google-blue-bg);
            border-radius: 24px;
            padding: 48px 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-bottom: 24px;
        }

        .upload-area:hover {
            background-color: #edf2fa;
            border-color: var(--google-blue);
            transform: translateY(-2px);
        }

        .upload-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #e8f0fe;
            color: var(--google-blue);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .upload-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
            margin: 0 0 6px 0;
        }

        .upload-hint {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0;
        }

        .format-chips {
            display: inline-flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .format-chip {
            font-size: 11.5px;
            font-weight: 500;
            color: var(--text-secondary);
            background: #ffffff;
            border: 1px solid var(--border-subtle);
            padding: 4px 12px;
            border-radius: 999px;
        }

        .file-input {
            display: none;
        }

        .file-list {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 任务列表项卡片 */
        .file-item {
            background-color: #f8fafd;
            border: 1px solid #e8eef5;
            border-radius: 18px;
            padding: 18px 22px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .file-item:hover {
            border-color: #d3e3fd;
            box-shadow: 0 4px 14px rgba(11, 87, 208, 0.05);
        }

        .file-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            margin-right: 20px;
            min-width: 0;
        }

        .file-name {
            font-weight: 600;
            font-size: 14.5px;
            color: var(--text-primary);
            word-break: break-all;
        }

        .file-size {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Material 3 状态胶囊 */
        .status-badge {
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            min-width: 86px;
            text-align: center;
            flex-shrink: 0;
        }

        .status-uploading {
            background-color: #fef7e0;
            color: #b06000;
        }

        .status-processing {
            background-color: #e8f0fe;
            color: #0b57d0;
        }

        .status-completed {
            background-color: #e6f4ea;
            color: #137333;
        }

        .status-error {
            background-color: #fce8e6;
            color: #c5221f;
        }

        /* Material 线性进度条 */
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: #e1e5ea;
            margin-top: 12px;
            border-radius: 999px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background: var(--gemini-gradient);
            width: 0%;
            border-radius: 999px;
            transition: width 0.35s ease, background-color 0.3s ease;
        }

        /* 任务日志折叠面板 */
        .log-details {
            margin-top: 10px;
            font-size: 12.5px;
            color: var(--text-secondary);
            background: #ffffff;
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 8px 14px;
        }

        .log-details summary {
            cursor: pointer;
            user-select: none;
            color: var(--text-secondary);
            font-weight: 500;
            outline: none;
        }

        .log-list {
            margin: 8px 0 2px 18px;
            padding: 0;
        }

        .log-list li {
            margin: 4px 0;
            line-height: 1.5;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-wrap">
        <div class="header-badge">✦ Knowledge Base Ingestion</div>
        <h1>金融知识库资料导入中心</h1>
        <p class="subtitle">支持上市公司财报、基金产品概要、银行理财风险揭示书、宏观政策报告及投教 FAQ 结构化入库</p>
    </div>
    
    <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
        </div>
        <p class="upload-title">点击选择文件，或将文件拖拽至此处上传</p>
        <p class="upload-hint">系统将自动完成文档切片、向量化索引及合规元数据抽取</p>
        <div class="format-chips">
            <span class="format-chip">PDF 文档 (.pdf)</span>
            <span class="format-chip">Word 文档 (.docx / .doc)</span>
            <span class="format-chip">Markdown (.md)</span>
        </div>
        <input type="file" id="fileInput" class="file-input" multiple accept=".pdf,.md,.docx,.doc">
    </div>

    <div id="fileList" class="file-list">
        <!-- 文件列表将在这里生成 -->
    </div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    
    // 默认走导入服务同源地址；如你把页面单独打开（file://），回退到导入服务默认端口。
    const API_BASE = location.origin.startsWith('http') ? location.origin : 'http://127.0.0.1:8000';

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '#e8f0fe';
        dropZone.style.borderColor = '#0b57d0';
    });

    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '';
        dropZone.style.borderColor = '';
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '';
        dropZone.style.borderColor = '';
        handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
        handleFiles(e.target.files);
    });

    function handleFiles(files) {
        Array.from(files).forEach(uploadFile);
    }

    function updateProgressBar(bar, percentage) {
        bar.style.width = percentage + '%';
        if (percentage >= 100) {
            bar.style.background = '#137333'; // Google Green
        } else {
            bar.style.background = 'linear-gradient(90deg, #4285f4, #9b72cb)'; // Gemini Gradient
        }
    }

    async function uploadFile(file) {
        // 创建文件项UI
        const id = 'file-' + Math.random().toString(36).substr(2, 9);
        const html = `
            <div class="file-item" id="${id}">
                <div class="file-info">
                    <span class="file-name">${file.name}</span>
                    <span class="file-size">${(file.size / 1024).toFixed(2)} KB</span>
                    <div class="progress-bar-container">
                        <div class="progress-bar"></div>
                    </div>
                    <details class="log-details">
                        <summary>日志（点击展开）</summary>
                        <ul class="log-list"></ul>
                    </details>
                </div>
                <div class="status-badge status-uploading">上传中...</div>
            </div>
        `;
        fileList.insertAdjacentHTML('afterbegin', html);
        const itemEl = document.getElementById(id);
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressBar = itemEl.querySelector('.progress-bar');
        const progressContainer = itemEl.querySelector('.progress-bar-container');

        // 构建FormData
        const formData = new FormData();
        formData.append('files', file);

        try {
            // 1. 上传文件
            progressContainer.style.display = 'block';
            // 模拟上传进度
            updateProgressBar(progressBar, 50);

            const response = await fetch(`${API_BASE}/upload`, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error('Upload failed');
            
            const result = await response.json();
            const taskId = result.task_ids[0]; // 假设一次传一个或取第一个

            // 上传完成，进入处理中，进度固定为30%
            updateProgressBar(progressBar, 30);
            statusBadge.textContent = '处理中...';
            statusBadge.className = 'status-badge status-processing';

            // 2. 轮询状态
            pollStatus(taskId, itemEl);

        } catch (error) {
            console.error(error);
            statusBadge.textContent = '失败';
            statusBadge.className = 'status-badge status-error';
        }
    }

    function normalizeDoneLog(text) {
        if (typeof text !== 'string') return String(text);
        return text.endsWith('已完成') ? text : `${text}已完成`;
    }

    function normalizeRunningLog(text) {
        if (typeof text !== 'string') return String(text);
        if (text.startsWith('正在进行')) return text.endsWith('...') ? text : `${text}...`;
        return `正在进行${text}...`;
    }

    function renderLogs(itemEl, doneList, runningList) {
        const logSummary = itemEl.querySelector('.log-details summary');
        const logListEl = itemEl.querySelector('.log-list');
        const logDetails = itemEl.querySelector('.log-details');

        const done = Array.isArray(doneList) ? doneList : [];
        const running = Array.isArray(runningList) ? runningList : [];

        logSummary.textContent = `日志（已完成${done.length}，进行中${running.length}，点击展开）`;

        logListEl.innerHTML = '';
        const lines = [
            ...done.map(normalizeDoneLog),
            ...running.map(normalizeRunningLog),
        ];

        if (lines.length === 0) {
            const li = document.createElement('li');
            li.textContent = '暂无日志';
            logListEl.appendChild(li);
        } else {
            for (const line of lines) {
                const li = document.createElement('li');
                li.textContent = line;
                logListEl.appendChild(li);
            }
        }

        if (lines.length === 0) {
            logDetails.open = false;
        }
    }

    function pollStatus(taskId, itemEl) {
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressBar = itemEl.querySelector('.progress-bar');
        
        const interval = setInterval(async () => {
            try {
                const res = await fetch(`${API_BASE}/status/${taskId}`);
                const data = await res.json();

                renderLogs(itemEl, data.done_list, data.running_list);
                
                if (data.status === 'completed') {
                    statusBadge.textContent = '已完成';
                    statusBadge.className = 'status-badge status-completed';
                    updateProgressBar(progressBar, 100);
                    clearInterval(interval);
                } else if (data.status === 'processing') {
                    statusBadge.textContent = '处理中...';
                    updateProgressBar(progressBar, 30);
                } else if (data.status === 'failed') {
                    statusBadge.textContent = '失败';
                    statusBadge.className = 'status-badge status-error';
                    clearInterval(interval);
                }
            } catch (e) {
                console.error('Polling error', e);
            }
        }, 2000);
    }
</script>

</body>
</html>
