<!-- 知识库文档导入工作台（与金融智能客服账本纸张风格统一） -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资料导入 · 金融智脑</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #F6F4EF;
            --paper-hover: #EFECE3;
            --surface: #FFFFFF;
            --ink: #14171C;
            --ink-2: #5B616B;
            --mist: #9AA0A8;
            --hairline: #E4E0D6;
            --celadon: #3F6F68;
            --celadon-soft: #EBF2F0;
            --seal: #B5432F;
            --seal-soft: #F9EAE7;
            --amber: #B7791F;
            --amber-soft: #FBF4E6;
            --shadow-ledger: 0 1px 2px rgba(20, 23, 28, .04), 0 6px 20px -10px rgba(20, 23, 28, .12);
            --font-sans: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
            --font-serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
            --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background-color: var(--paper);
            color: var(--ink);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
        }

        /* 主容器 */
        .container {
            width: 100%;
            max-width: 840px;
            margin: 0 auto;
            padding: 28px 24px 56px;
        }

        .header-wrap {
            margin-bottom: 20px;
        }

        .eyebrow {
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--celadon);
            font-weight: 600;
            margin-bottom: 4px;
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 20px;
            font-weight: 600;
            color: var(--ink);
            margin: 0 0 6px 0;
        }

        .subtitle {
            color: var(--ink-2);
            font-size: 13.5px;
            line-height: 1.65;
            margin: 0;
        }

        /* 账本纸张风格上传卡片 */
        .upload-area {
            border: 1.5px dashed #CFC9BA;
            background-color: var(--surface);
            border-radius: 12px;
            padding: 38px 28px;
            text-align: center;
            cursor: pointer;
            box-shadow: var(--shadow-ledger);
            transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
        }

        .upload-area:hover {
            background-color: #FCFBF8;
            border-color: var(--celadon);
        }

        .upload-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: var(--paper);
            border: 1px solid var(--hairline);
            color: var(--celadon);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .upload-title {
            font-size: 14.5px;
            font-weight: 600;
            color: var(--ink);
            margin: 0 0 5px 0;
        }

        .upload-hint {
            font-size: 12.5px;
            color: var(--ink-2);
            margin: 0;
        }

        .file-input {
            display: none;
        }

        /* 任务列表区域 */
        .file-list {
            margin-top: 22px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .file-item {
            background-color: var(--surface);
            border: 1px solid var(--hairline);
            border-radius: 10px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            box-shadow: 0 1px 2px rgba(20, 23, 28, .03);
            transition: border-color 0.15s ease;
        }

        .file-item:hover {
            border-color: #CFC9BA;
        }

        .file-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            margin-right: 18px;
            min-width: 0;
        }

        .file-name {
            font-weight: 600;
            font-size: 13.5px;
            color: var(--ink);
            word-break: break-all;
        }

        .file-size {
            font-family: var(--font-mono);
            font-size: 11.5px;
            color: var(--mist);
            margin-top: 3px;
            font-variant-numeric: tabular-nums;
        }

        /* 状态标签 */
        .status-badge {
            padding: 3px 9px;
            border-radius: 6px;
            font-size: 11.5px;
            font-weight: 500;
            text-align: center;
            flex-shrink: 0;
            border: 1px solid transparent;
        }

        .status-uploading {
            background-color: var(--amber-soft);
            border-color: rgba(183, 121, 31, 0.25);
            color: var(--amber);
        }

        .status-processing {
            background-color: var(--celadon-soft);
            border-color: rgba(63, 111, 104, 0.25);
            color: var(--celadon);
        }

        .status-completed {
            background-color: var(--celadon-soft);
            border-color: rgba(63, 111, 104, 0.35);
            color: var(--celadon);
        }

        .status-error {
            background-color: var(--seal-soft);
            border-color: rgba(181, 67, 47, 0.28);
            color: var(--seal);
        }

        /* 极细线性进度条 */
        .progress-bar-container {
            width: 100%;
            height: 4px;
            background-color: var(--paper);
            margin-top: 10px;
            border-radius: 999px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--celadon);
            width: 0%;
            border-radius: 999px;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        /* 任务日志折叠栏 */
        .log-details {
            margin-top: 10px;
            font-size: 12px;
            color: var(--ink-2);
        }

        .log-details summary {
            cursor: pointer;
            user-select: none;
            color: var(--ink-2);
            font-size: 12px;
            outline: none;
        }

        .log-details summary:hover {
            color: var(--ink);
        }

        .log-list {
            margin: 8px 0 0 0;
            padding: 8px 12px;
            list-style: none;
            background: var(--paper);
            border: 1px solid var(--hairline);
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 11.5px;
        }

        .log-list li {
            margin: 4px 0;
            line-height: 1.5;
            color: var(--ink-2);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-wrap">
        <div class="eyebrow">MILVUS KNOWLEDGE INGESTION</div>
        <h1>添加知识源文档</h1>
        <p class="subtitle">上传上市公司定期财报、基金招募说明书、银行理财风险揭示书或监管政策文件，系统将自动执行文本切片与向量索引。</p>
    </div>
    
    <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
        </div>
        <p class="upload-title">拖拽文件至此处，或点击选择本地文件</p>
        <p class="upload-hint">支持格式：PDF (.pdf)、Word (.docx / .doc)、Markdown (.md)</p>
        <input type="file" id="fileInput" class="file-input" multiple accept=".pdf,.md,.docx,.doc">
    </div>

    <div id="fileList" class="file-list">
        <!-- 文件列表将在这里生成 -->
    </div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    
    const API_BASE = location.origin.startsWith('http') ? location.origin : 'http://127.0.0.1:8002';

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '#FBF9F4';
        dropZone.style.borderColor = '#3F6F68';
    });

    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '';
        dropZone.style.borderColor = '';
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '';
        dropZone.style.borderColor = '';
        handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
        handleFiles(e.target.files);
    });

    function handleFiles(files) {
        Array.from(files).forEach(uploadFile);
    }

    function updateProgressBar(bar, percentage) {
        bar.style.width = percentage + '%';
        if (percentage >= 100) {
            bar.style.backgroundColor = '#3F6F68';
        } else {
            bar.style.backgroundColor = '#B7791F';
        }
    }

    async function uploadFile(file) {
        const id = 'file-' + Math.random().toString(36).substr(2, 9);
        const html = `
            <div class="file-item" id="${id}">
                <div class="file-info">
                    <span class="file-name">${file.name}</span>
                    <span class="file-size">${(file.size / 1024).toFixed(2)} KB</span>
                    <div class="progress-bar-container">
                        <div class="progress-bar"></div>
                    </div>
                    <details class="log-details">
                        <summary>查看处理日志</summary>
                        <ul class="log-list"></ul>
                    </details>
                </div>
                <div class="status-badge status-uploading">上传中</div>
            </div>
        `;
        fileList.insertAdjacentHTML('afterbegin', html);
        const itemEl = document.getElementById(id);
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressBar = itemEl.querySelector('.progress-bar');
        const progressContainer = itemEl.querySelector('.progress-bar-container');

        const formData = new FormData();
        formData.append('files', file);

        try {
            progressContainer.style.display = 'block';
            updateProgressBar(progressBar, 50);

            const response = await fetch(`${API_BASE}/upload`, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error('Upload failed');
            
            const result = await response.json();
            const taskId = result.task_ids[0];

            updateProgressBar(progressBar, 30);
            statusBadge.textContent = '索引中';
            statusBadge.className = 'status-badge status-processing';

            pollStatus(taskId, itemEl);

        } catch (error) {
            console.error(error);
            statusBadge.textContent = '失败';
            statusBadge.className = 'status-badge status-error';
        }
    }

    function normalizeDoneLog(text) {
        if (typeof text !== 'string') return String(text);
        return text.endsWith('已完成') ? text : `${text}已完成`;
    }

    function normalizeRunningLog(text) {
        if (typeof text !== 'string') return String(text);
        if (text.startsWith('正在进行')) return text.endsWith('...') ? text : `${text}...`;
        return `正在进行${text}...`;
    }

    function renderLogs(itemEl, doneList, runningList) {
        const logSummary = itemEl.querySelector('.log-details summary');
        const logListEl = itemEl.querySelector('.log-list');
        const logDetails = itemEl.querySelector('.log-details');

        const done = Array.isArray(doneList) ? doneList : [];
        const running = Array.isArray(runningList) ? runningList : [];

        logSummary.textContent = `处理日志（已完成 ${done.length}，进行中 ${running.length}）`;

        logListEl.innerHTML = '';
        const lines = [
            ...done.map(normalizeDoneLog),
            ...running.map(normalizeRunningLog),
        ];

        if (lines.length === 0) {
            const li = document.createElement('li');
            li.textContent = '暂无日志';
            logListEl.appendChild(li);
        } else {
            for (const line of lines) {
                const li = document.createElement('li');
                li.textContent = line;
                logListEl.appendChild(li);
            }
        }

        if (lines.length === 0) {
            logDetails.open = false;
        }
    }

    function pollStatus(taskId, itemEl) {
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressBar = itemEl.querySelector('.progress-bar');
        
        const interval = setInterval(async () => {
            try {
                const res = await fetch(`${API_BASE}/status/${taskId}`);
                const data = await res.json();

                renderLogs(itemEl, data.done_list, data.running_list);
                
                if (data.status === 'completed') {
                    statusBadge.textContent = '已完成';
                    statusBadge.className = 'status-badge status-completed';
                    updateProgressBar(progressBar, 100);
                    clearInterval(interval);
                } else if (data.status === 'processing') {
                    statusBadge.textContent = '索引中';
                    updateProgressBar(progressBar, 30);
                } else if (data.status === 'failed') {
                    statusBadge.textContent = '失败';
                    statusBadge.className = 'status-badge status-error';
                    clearInterval(interval);
                }
            } catch (e) {
                console.error('Polling error', e);
            }
        }, 2000);
    }
</script>

</body>
</html>
