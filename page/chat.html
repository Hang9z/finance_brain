<!-- 查询演示页面，用于体验普通问答与流式响应（Gemini 风格重制版） -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>金融智脑 · 智能合规问答平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-surface: #ffffff;
      --bg-container: #f0f4f9;
      --bg-container-hover: #e1e5ea;
      --text-primary: #1f1f1f;
      --text-secondary: #444746;
      --text-muted: #747775;
      --google-blue: #0b57d0;
      --google-blue-light: #d3e3fd;
      --border-subtle: #e3e3e3;
      --gemini-gradient: linear-gradient(135deg, #4285f4 0%, #9b72cb 50%, #d96570 100%);
      --gemini-soft-bg: linear-gradient(135deg, rgba(66,133,244,0.08) 0%, rgba(155,114,203,0.08) 50%, rgba(217,101,112,0.08) 100%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', 'Noto Sans SC', "Google Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-surface);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app-layout {
      width: 100vw;
      height: 100vh;
      display: flex;
      overflow: hidden;
      background: var(--bg-surface);
    }

    .app {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg-surface);
      position: relative;
    }

    /* 左侧历史会话抽屉 */
    .sidebar {
      width: 270px;
      height: 100%;
      background: #f8fafc;
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: margin-left 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 30;
      user-select: none;
    }

    .sidebar.collapsed {
      margin-left: -270px;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px;
    }

    .sidebar-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-collapse-sidebar {
      background: transparent;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      transition: background 0.15s ease;
      font-size: 16px;
    }

    .btn-collapse-sidebar:hover {
      background: var(--bg-container-hover);
      color: var(--text-primary);
    }

    .sidebar-action-wrap {
      padding: 0 12px 10px;
    }

    .btn-new-chat {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: 12px;
      background: var(--google-blue-light);
      border: 1px solid rgba(11, 87, 208, 0.2);
      color: var(--google-blue);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-new-chat:hover {
      background: #c3d9fb;
      box-shadow: 0 2px 6px rgba(11, 87, 208, 0.15);
    }

    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .session-list::-webkit-scrollbar {
      width: 4px;
    }
    .session-list::-webkit-scrollbar-thumb {
      background: #dadce0;
      border-radius: 999px;
    }

    .session-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      color: var(--text-secondary);
    }

    .session-item:hover {
      background: var(--bg-container);
      color: var(--text-primary);
    }

    .session-item.active {
      background: #e8f0fe;
      border-color: rgba(11, 87, 208, 0.25);
      color: var(--google-blue);
    }

    .session-icon {
      font-size: 14px;
      flex-shrink: 0;
      opacity: 0.75;
    }

    .session-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .session-title {
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.35;
      color: inherit;
    }

    .session-time {
      font-size: 11px;
      color: var(--text-muted);
    }

    .session-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .session-item:hover .session-actions,
    .session-item.active .session-actions {
      opacity: 1;
    }

    .btn-session-action {
      background: transparent;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      color: var(--text-secondary);
      transition: background 0.15s ease;
      padding: 0;
    }

    .btn-session-action:hover {
      background: rgba(0, 0, 0, 0.08);
      color: var(--text-primary);
    }

    .session-empty {
      text-align: center;
      padding: 36px 12px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .sidebar-footer {
      padding: 10px 14px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .btn-clear-all-sessions {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.15s ease;
    }

    .btn-clear-all-sessions:hover {
      background: var(--bg-container-hover);
      color: #b3261e;
    }

    .btn-toggle-sidebar {
      background: transparent;
      border: 1px solid var(--border-subtle);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.15s ease;
      margin-right: 4px;
      flex-shrink: 0;
    }

    .btn-toggle-sidebar:hover {
      background: var(--bg-container);
      color: var(--text-primary);
    }

    /* 顶部导航栏：极简 Google 顶栏 */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--gemini-soft-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .title {
      display: flex;
      flex-direction: column;
    }

    .title strong {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.2px;
      background: linear-gradient(90deg, #1f1f1f 0%, #0b57d0 60%, #9b72cb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title span {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .top-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    /* 流式输出开关芯片 */
    .stream-label {
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--bg-container);
      transition: background 0.2s ease;
      font-weight: 500;
    }

    .stream-label:hover {
      background: var(--bg-container-hover);
    }

    .stream-label input[type="checkbox"] {
      accent-color: var(--google-blue);
      width: 15px;
      height: 15px;
      margin: 0;
      cursor: pointer;
    }

    /* API 状态指示器 */
    .pill {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--bg-container);
      padding: 6px 14px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .pill::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #146c2e;
      box-shadow: 0 0 0 2px rgba(20, 108, 46, 0.15);
    }

    .btn {
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-secondary);
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn:hover {
      background: var(--bg-container);
      border-color: #d0d5dd;
      color: var(--text-primary);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }


    /* 聊天主视窗 */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 28px 20px 36px;
      scroll-behavior: smooth;
    }

    .chat::-webkit-scrollbar {
      width: 6px;
    }
    .chat::-webkit-scrollbar-thumb {
      background: #dadce0;
      border-radius: 999px;
    }

    .dayline {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      margin: 0 auto 24px;
      max-width: 840px;
    }

    .msg {
      display: flex;
      gap: 16px;
      margin: 24px auto;
      max-width: 840px;
      align-items: flex-start;
    }

    .msg.user {
      justify-content: flex-end;
    }

    /* 保持原版关键伸缩属性，防止窄屏竖排 */
    .msg > div:not(.avatar) {
      flex: 1;
      min-width: 0;
    }

    .msg.user > div:not(.avatar) {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--google-blue-light);
      color: var(--google-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      flex: 0 0 auto;
      margin-top: 2px;
    }

    .avatar.bot {
      background: var(--gemini-gradient);
      color: #ffffff;
      font-size: 0;
      box-shadow: 0 2px 10px rgba(66, 133, 244, 0.25);
    }

    /* 用 CSS 为机器人头像绘制星芒图标，无需改动 JS 模板中的文字 */
    .avatar.bot::after {
      content: "✦";
      font-size: 18px;
      line-height: 1;
    }

    .bubble {
      max-width: 100%;
      display: inline-block;
      border-radius: 20px;
      padding: 6px 4px;
      background: transparent;
      color: var(--text-primary);
      position: relative;
      line-height: 1.7;
      font-size: 15px;
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    /* 用户气泡：Gemini 浅灰蓝大圆角胶囊 */
    .msg.user .bubble {
      background: var(--bg-container);
      color: var(--text-primary);
      padding: 12px 20px;
      border-radius: 24px 24px 6px 24px;
      max-width: min(660px, 85%);
    }

    .meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
      padding: 0 4px;
    }

    /* 阶段进度折叠栏：Gemini 思考过程卡片风格 */
    details.progress {
      margin-top: 10px;
      margin-bottom: 8px;
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 10px 16px;
      background: #f8fafd;
      transition: all 0.2s ease;
    }

    details.progress summary {
      cursor: pointer;
      user-select: none;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      outline: none;
    }

    .progress ul {
      margin: 8px 0 0 18px;
      padding: 0;
    }

    .progress li {
      margin: 5px 0;
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    .answer-images {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .answer-images img {
      display: block;
      max-width: min(100%, 600px);
      max-height: 600px;
      width: auto;
      height: auto;
      border-radius: 16px;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      background: #fff;
    }

    .answer-images a {
      font-size: 12px;
      color: var(--google-blue);
      text-decoration: none;
      word-break: break-all;
    }

    .answer-images a:hover {
      text-decoration: underline;
    }

    /* Gemini 炫彩呼吸加载点 */
    .typing {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      padding: 6px 4px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gemini-gradient);
      animation: bounce 1.2s infinite ease-in-out;
    }

    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.75); opacity: 0.45; }
      40% { transform: scale(1.15); opacity: 1; }
    }

    /* 底部胶囊输入区 */
    .composer-container {
      width: 100%;
      max-width: 840px;
      margin: 0 auto;
      padding: 0 20px 18px;
      background: var(--bg-surface);
    }

    .composer {
      background: var(--bg-container);
      border-radius: 32px;
      padding: 8px 10px 8px 22px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      border: 1px solid transparent;
      transition: background 0.2s, box-shadow 0.2s, border-color 0.2s;
    }

    .composer:focus-within {
      background: #ffffff;
      border-color: #d3e3fd;
      box-shadow: 0 4px 20px rgba(11, 87, 208, 0.1);
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 40px;
      max-height: 150px;
      padding: 8px 0;
      border: none;
      background: transparent;
      outline: none;
      font-size: 15px;
      line-height: 1.5;
      color: var(--text-primary);
      font-family: inherit;
    }

    textarea::placeholder {
      color: var(--text-muted);
    }

    .send {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      color: #fff;
      background: var(--google-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background 0.2s ease;
      flex-shrink: 0;
    }

    .send:hover:not(:disabled) {
      background: #0842a0;
      transform: scale(1.04);
    }

    .send:disabled {
      background: #e1e5ea;
      color: #9aa0a6;
      cursor: not-allowed;
    }

    .hint {
      text-align: center;
      padding-top: 8px;
      color: var(--text-muted);
      font-size: 11.5px;
    }

    .kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      border: 1px solid var(--border-subtle);
      padding: 1px 6px;
      border-radius: 6px;
      background: var(--bg-container);
      color: var(--text-secondary);
      font-size: 11px;
    }

    /* 预设问题 Suggestion Chips */
    .pill-btn {
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-secondary);
      font-size: 13px;
      padding: 9px 16px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      font-family: inherit;
    }

    .pill-btn:hover {
      background: var(--bg-container);
      border-color: #c2e7ff;
      color: var(--google-blue);
      transform: translateY(-1px);
    }

    /* 五段式金融合规徽章（Material 3 柔和语义色） */
    .fin-badge {
      display: inline-flex;
      align-items: center;
      font-weight: 600;
      font-size: 13px;
      margin-top: 14px;
      margin-bottom: 6px;
      padding: 4px 12px;
      border-radius: 8px;
    }

    .fin-badge.conclusion {
      color: #0b57d0;
      background: #e8f0fe;
    }

    .fin-badge.details {
      color: #0f5223;
      background: #e6f4ea;
    }

    .fin-badge.risk {
      color: #b06000;
      background: #fef7e0;
    }

    .fin-badge.source {
      color: #444746;
      background: #f0f4f9;
    }

    .fin-badge.disclaimer {
      color: #b3261e;
      background: #fce8e6;
      font-size: 12px;
    }

    .answer-text {
      line-height: 1.75;
      font-size: 15px;
      color: var(--text-primary);
    }

    /* 欢迎卡片装饰 */
    .welcome-box {
      background: var(--bg-container);
      border-radius: 20px;
      padding: 18px 20px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- 左侧历史会话抽屉 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">
          <span>💬</span>
          <span>历史会话</span>
        </div>
        <button class="btn-collapse-sidebar" id="btnCollapseSidebar" title="收起边栏">‹</button>
      </div>

      <div class="sidebar-action-wrap">
        <button class="btn-new-chat" id="btnNewChat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>开启新对话</span>
        </button>
      </div>

      <div class="session-list" id="sessionList">
        <!-- 动态渲染历史会话条目 -->
      </div>

      <div class="sidebar-footer">
        <span id="sessionCount">共 0 个会话</span>
        <button class="btn-clear-all-sessions" id="btnClearAllSessions" title="清空所有历史会话">清空全部</button>
      </div>
    </aside>

    <div class="app">
      <div class="topbar">
        <div class="brand">
          <button class="btn-toggle-sidebar" id="btnToggleSidebar" title="展开/收起历史记录抽屉">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="logo">
            <!-- Gemini Sparkle SVG -->
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2C12 7.52285 16.4772 12 22 12C16.4772 12 12 16.4772 12 22C12 16.4772 7.52285 12 2 12C7.52285 12 12 7.52285 12 2Z" fill="url(#gemini-grad)"/>
              <defs>
                <linearGradient id="gemini-grad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#4285F4"/>
                  <stop offset="0.5" stop-color="#9B72CB"/>
                  <stop offset="1" stop-color="#D96570"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <div class="title">
            <strong>金融智脑 · 智能合规问答平台</strong>
            <span id="subTitle">在线 · 覆盖财报 / 基金 / 银行理财 / 宏观政策 / 投教问答</span>
          </div>
        </div>
        <div class="top-actions">
          <label class="stream-label">
            <input type="checkbox" id="streamToggle" checked> 流式输出
          </label>
          <span class="pill" id="apiPill">API: 未连接</span>
          <button class="btn" id="btnClear" title="清空当前会话的历史对话">清空记录</button>
        </div>
      </div>

    <div class="chat" id="chat">
      <div class="dayline">今天</div>
      <div class="msg bot">
        <div class="avatar bot">金融智脑</div>
        <div>
          <div class="bubble">

  <script>
    // 默认走查询服务同源地址；如你把页面单独打开（file://），回退到查询服务默认端口。
    const API_BASE = location.origin.startsWith('http') ? location.origin : 'http://127.0.0.1:8001';
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const apiPill = document.getElementById('apiPill');
    const btnClear = document.getElementById('btnClear');
    const streamToggle = document.getElementById('streamToggle');

    // 输入框自适应高度
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 150) + 'px';
    });

    // ==========================================
    // 历史会话抽屉管理与本地持久化 (LocalStorage)
    // ==========================================
    const SESSIONS_KEY = 'finance_brain_sessions';
    const ACTIVE_KEY = 'finance_brain_active_session';
    const COLLAPSED_KEY = 'finance_brain_sidebar_collapsed';

    const sidebarEl = document.getElementById('sidebar');
    const btnToggleSidebar = document.getElementById('btnToggleSidebar');
    const btnCollapseSidebar = document.getElementById('btnCollapseSidebar');
    const btnNewChat = document.getElementById('btnNewChat');
    const sessionListEl = document.getElementById('sessionList');
    const sessionCountEl = document.getElementById('sessionCount');
    const btnClearAllSessions = document.getElementById('btnClearAllSessions');
    const subTitleEl = document.getElementById('subTitle');

    // 侧边栏折叠/展开记忆
    if (localStorage.getItem(COLLAPSED_KEY) === 'true') {
      sidebarEl.classList.add('collapsed');
    }
    function toggleSidebar() {
      const isCollapsed = sidebarEl.classList.toggle('collapsed');
      localStorage.setItem(COLLAPSED_KEY, isCollapsed ? 'true' : 'false');
    }
    if (btnToggleSidebar) btnToggleSidebar.addEventListener('click', toggleSidebar);
    if (btnCollapseSidebar) btnCollapseSidebar.addEventListener('click', toggleSidebar);

    // 获取本地会话列表
    function getStoredSessions() {
      try {
        const raw = localStorage.getItem(SESSIONS_KEY);
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        return [];
      }
    }

    function saveStoredSessions(list) {
      localStorage.setItem(SESSIONS_KEY, JSON.stringify(list));
    }

    // 相对时间展示
    function formatRelativeTime(ts) {
      if (!ts) return '刚刚';
      const now = Date.now();
      const diff = Math.floor((now - ts) / 1000);
      if (diff < 60) return '刚刚';
      if (diff < 3600) return `${Math.floor(diff / 60)}分钟前`;
      
      const d = new Date(ts);
      const today = new Date();
      if (d.toDateString() === today.toDateString()) {
        return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      }
      return `${(d.getMonth() + 1).toString().padStart(2, '0')}-${d.getDate().toString().padStart(2, '0')}`;
    }

    let sessions = getStoredSessions();

    // 确定当前会话 ID:
    // 1. URL 参数中指定 ?session=xxx 或 ?user=xxx 优先
    // 2. 否则取本地记录的 active session
    // 3. 否则取 sessions 列表首项，或新建全新会话
    const urlParams = new URLSearchParams(window.location.search);
    const queryUser = urlParams.get('user') || urlParams.get('session');
    let sessionId = "";

    if (queryUser) {
      sessionId = queryUser.startsWith("sess-") || queryUser.startsWith("user_") ? queryUser : `user_${queryUser}`;
      let found = sessions.find(s => s.id === sessionId);
      if (!found) {
        found = {
          id: sessionId,
          title: `用户 ${queryUser} 对话`,
          createdAt: Date.now(),
          updatedAt: Date.now()
        };
        sessions.unshift(found);
        saveStoredSessions(sessions);
      }
    } else {
      const savedActive = localStorage.getItem(ACTIVE_KEY) || sessionStorage.getItem('kb_session_id');
      if (savedActive && sessions.some(s => s.id === savedActive)) {
        sessionId = savedActive;
      } else if (sessions.length > 0) {
        sessionId = sessions[0].id;
      } else {
        sessionId = 'sess-' + Math.random().toString(36).slice(2, 8) + '-' + Date.now().toString(36);
        sessions.unshift({
          id: sessionId,
          title: '新对话',
          createdAt: Date.now(),
          updatedAt: Date.now()
        });
        saveStoredSessions(sessions);
      }
    }

    localStorage.setItem(ACTIVE_KEY, sessionId);
    sessionStorage.setItem('kb_session_id', sessionId);

    function updateSubTitle(title) {
      if (!subTitleEl) return;
      const display = title || (sessions.find(s => s.id === sessionId)?.title) || '新对话';
      subTitleEl.textContent = `在线 · 会话: ${display} · 覆盖财报 / 基金 / 银行理财 / 宏观政策 / 投教问答`;
    }

    function renderSessionList() {
      if (!sessionListEl) return;
      sessionListEl.innerHTML = '';

      if (sessions.length === 0) {
        sessionListEl.innerHTML = '<div class="session-empty">暂无历史会话<br/><span style="font-size:11px;opacity:0.7;">点击上方按钮开启新对话</span></div>';
        if (sessionCountEl) sessionCountEl.textContent = '共 0 个会话';
        return;
      }

      if (sessionCountEl) sessionCountEl.textContent = `共 ${sessions.length} 个会话`;

      sessions.forEach(item => {
        const itemEl = document.createElement('div');
        const isActive = item.id === sessionId;
        itemEl.className = `session-item ${isActive ? 'active' : ''}`;
        itemEl.setAttribute('data-id', item.id);
        itemEl.title = item.title || '新对话';

        itemEl.innerHTML = `
          <div class="session-icon">💬</div>
          <div class="session-info">
            <div class="session-title">${escapeHtml(item.title || '新对话')}</div>
            <div class="session-time">${formatRelativeTime(item.updatedAt || item.createdAt)}</div>
          </div>
          <div class="session-actions">
            <button class="btn-session-action btn-rename" title="重命名会话">✏️</button>
            <button class="btn-session-action btn-delete" title="删除会话">🗑️</button>
          </div>
        `;

        // 切换会话
        itemEl.addEventListener('click', (e) => {
          if (e.target.closest('.btn-session-action')) return;
          if (item.id === sessionId) return;
          switchSession(item.id);
        });

        // 重命名
        const btnRename = itemEl.querySelector('.btn-rename');
        btnRename.addEventListener('click', (e) => {
          e.stopPropagation();
          const newTitle = prompt('请输入新会话名称：', item.title || '新对话');
          if (newTitle && newTitle.trim() && newTitle.trim() !== item.title) {
            item.title = newTitle.trim();
            item.updatedAt = Date.now();
            saveStoredSessions(sessions);
            renderSessionList();
            if (item.id === sessionId) updateSubTitle(item.title);
          }
        });

        // 删除
        const btnDelete = itemEl.querySelector('.btn-delete');
        btnDelete.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!confirm(`确定要删除会话「${item.title || '新对话'}」吗？历史消息将全部清除。`)) return;
          
          try {
            fetch(`${API_BASE}/history/${item.id}`, { method: 'DELETE' }).catch(() => {});
          } catch (_) {}

          sessions = sessions.filter(s => s.id !== item.id);
          saveStoredSessions(sessions);

          if (item.id === sessionId) {
            if (sessions.length > 0) {
              switchSession(sessions[0].id);
            } else {
              createNewSession();
            }
          } else {
            renderSessionList();
          }
        });

        sessionListEl.appendChild(itemEl);
      });
    }

    async function switchSession(newId) {
      sessionId = newId;
      localStorage.setItem(ACTIVE_KEY, sessionId);
      sessionStorage.setItem('kb_session_id', sessionId);
      
      const curr = sessions.find(s => s.id === sessionId);
      updateSubTitle(curr ? curr.title : '新对话');
      renderSessionList();
      resetChatView();
      await loadHistory(sessionId);
    }

    function createNewSession() {
      const newId = 'sess-' + Math.random().toString(36).slice(2, 8) + '-' + Date.now().toString(36);
      const newSession = {
        id: newId,
        title: '新对话',
        createdAt: Date.now(),
        updatedAt: Date.now()
      };
      sessions.unshift(newSession);
      saveStoredSessions(sessions);

      sessionId = newId;
      localStorage.setItem(ACTIVE_KEY, sessionId);
      sessionStorage.setItem('kb_session_id', sessionId);

      if (window.location.search) {
        window.history.replaceState({}, '', window.location.pathname);
      }

      resetChatView();
      renderSessionList();
      updateSubTitle('新对话');
      inputEl.focus();
    }

    if (btnNewChat) {
      btnNewChat.addEventListener('click', createNewSession);
    }

    if (btnClearAllSessions) {
      btnClearAllSessions.addEventListener('click', async () => {
        if (!confirm('确定要清空全部本地历史会话记录吗？')) return;
        for (const s of sessions) {
          try {
            fetch(`${API_BASE}/history/${s.id}`, { method: 'DELETE' }).catch(() => {});
          } catch (_) {}
        }
        sessions = [];
        saveStoredSessions(sessions);
        createNewSession();
      });
    }

    // 首次提问时自动根据问题内容重命名会话标题
    function autoIndexSession(queryText) {
      if (!queryText) return;
      let curr = sessions.find(s => s.id === sessionId);
      if (!curr) {
        curr = {
          id: sessionId,
          title: '新对话',
          createdAt: Date.now(),
          updatedAt: Date.now()
        };
        sessions.unshift(curr);
      }

      // 如果当前是初始名字或未命名，提取前 22 个字命名
      if (curr.title === '新对话' || !curr.title || curr.title.startsWith('sess-')) {
        const clean = queryText.replace(/[\r\n]+/g, ' ').trim();
        curr.title = clean.length > 22 ? clean.slice(0, 22) + '...' : clean;
      }
      curr.updatedAt = Date.now();
      
      // 置顶最近更新的会话
      sessions = [curr, ...sessions.filter(s => s.id !== sessionId)];
      saveStoredSessions(sessions);
      renderSessionList();
      updateSubTitle(curr.title);
    }

    function resetChatView() {
      const nodes = Array.from(chatEl.querySelectorAll('.msg'));
      for (let i = 1; i < nodes.length; i++) nodes[i].remove();
      scrollToBottom();
    }

    function scrollToBottom(){
      chatEl.scrollTop = chatEl.scrollHeight;
    }
    function nowTime(){
      const d = new Date();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function formatTime(ts){
      if(!ts) return nowTime();
      const d = new Date(Number(ts) * 1000);
      if(Number.isNaN(d.getTime())) return nowTime();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    function fillInput(queryText){
      if(!queryText) return;
      const el = document.getElementById('input');
      if(el){
        el.value = queryText;
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 150) + 'px';
        el.focus();
      }
    }

    function formatFinancialAnswerHtml(rawText){
      if(!rawText) return '';
      let html = escapeHtml(rawText);

      // 结构化格式化五段式标题徽章
      html = html.replace(/【简要结论】/g, '<div class="fin-badge conclusion">🎯 【简要结论】</div>');
      html = html.replace(/【详细解析】/g, '<div class="fin-badge details">📊 【详细解析】</div>');
      html = html.replace(/【风险提示(?:\/注意事项)?】|【风险提示】|【注意事项】/g, '<div class="fin-badge risk">⚠️ 【风险提示 / 注意事项】</div>');
      html = html.replace(/【引用来源】/g, '<div class="fin-badge source">📌 【引用来源】</div>');
      html = html.replace(/【合规免责声明】/g, '<div class="fin-badge disclaimer">⚖️ 【合规免责声明】</div>');

      // 换行与段落
      html = html.replace(/\n\n/g, '<br/><br/>').replace(/\n/g, '<br/>');
      return html;
    }

    function isImageUrl(url){
      try {
        const u = new URL(url);
        return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.pathname);
      } catch (e) {
        return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || '');
      }
    }

    function normalizeUrl(rawUrl){
      const s = String(rawUrl || '').trim();
      if(!s) return '';
      return s.replace(/\s/g, '%20');
    }

    function dedupeKeepOrder(arr){
      const seen = new Set();
      const out = [];
      for(const x of (Array.isArray(arr) ? arr : [])){
        const v = String(x || '');
        if(!v) continue;
        if(seen.has(v)) continue;
        seen.add(v);
        out.push(v);
      }
      return out;
    }

    function extractUrlsLoose(text){
      const s = String(text || '');
      const regex = /(https?:\/\/[^\s]+)/g;
      const matches = s.match(regex) || [];
      const urls = [];
      
      const trimTailPunct = (u) => String(u || '').replace(/[)\]}'">，。,;；\]】）＞]+$/g, '');
      const trimHeadPunct = (u) => String(u || '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '');

      for(const m of matches){
        let u = trimHeadPunct(trimTailPunct(m));
        if(u) urls.push(u);
      }
      return dedupeKeepOrder(urls);
    }

    function parseImagesFromTextLoosely(text){
      const urls = extractUrlsLoose(text).filter(isImageUrl);
      return dedupeKeepOrder(urls);
    }

    function findLastImageMarkerIndex(raw){
      const s = String(raw || '');
      const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
      let m;
      let lastIdx = -1;
      let lastLen = 0;
      while((m = re.exec(s)) !== null){
        lastIdx = m.index;
        lastLen = m[0].length;
      }
      return { idx: lastIdx, len: lastLen };
    }

    function parseAnswerAndImages(text){
      const raw = String(text || '');
      const { idx, len } = findLastImageMarkerIndex(raw);
      if(idx === -1) return { text: raw, images: [] };

      const before = raw.slice(0, idx).trimEnd();
      const after = raw.slice(idx + len).trim();
      const urls = [];

      const lines = after.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      for(const line of lines){
        if(line.startsWith('http://') || line.startsWith('https://')){
          urls.push(line);
        }else{
          const matches = extractUrlsLoose(line);
          for(const u of matches){
            urls.push(u);
          }
        }
      }

      const seen = new Set();
      const images = [];
      for(const u of urls){
        const normalized = normalizeUrl(u);
        if(!isImageUrl(normalized)) continue;
        if(seen.has(normalized)) continue;
        seen.add(normalized);
        images.push(normalized);
      }
      return { text: before, images };
    }

    function shouldShowImagesByAnswer(answerText){
      const t = String(answerText || '');
      const keywords = [
        '如图', '如下图', '见图', '见下图', '下图', '上图',
        '图片', '示意图', '结构图', '外观', '接线图', '电路图', '原理图', '安装图', '尺寸图', '截图'
      ];
      return keywords.some(k => t.includes(k));
    }

    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls){
      const { text, images: imagesFromBlock } = parseAnswerAndImages(answerText);
      const candidates = Array.isArray(candidateImageUrls)
        ? candidateImageUrls.map(normalizeUrl).filter(isImageUrl)
        : [];
      const hasBlockImages = imagesFromBlock && imagesFromBlock.length > 0;
      const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);
      
      const allImages = new Set([
          ...(hasBlockImages ? imagesFromBlock : []),
          ...candidates,
          ...looseImages
      ]);
      const images = Array.from(allImages);

      containerEl.textContent = '';

      if((text || '').trim().length > 0){
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.innerHTML = formatFinancialAnswerHtml(text);
        containerEl.appendChild(textEl);
      }else{
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.textContent = '（已完成，但未返回答案）';
        containerEl.appendChild(textEl);
      }

      if(images && images.length > 0){
        const imgWrap = document.createElement('div');
        imgWrap.className = 'answer-images';
        for(const url of images){
          const safeUrl = normalizeUrl(url);
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.src = safeUrl;
          img.alt = '参考图片';
          img.referrerPolicy = 'no-referrer';
          img.addEventListener('error', () => {
            img.style.display = 'none';
          });
          imgWrap.appendChild(img);

          const link = document.createElement('a');
          link.href = safeUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = url;
          imgWrap.appendChild(link);
        }
        containerEl.appendChild(imgWrap);
      }
    }

    function addUserMsg(text){
      const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${nowTime()}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addUserMsgWithTime(text, ts){
      const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addBotMsgWithTime(text, ts, imageUrls){
      const id = 'bot-his-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">金融智脑</div>
          <div>
            <div class="bubble"><div class="answer"></div></div>
            <div class="meta">${formatTime(ts)}</div>

      if(el){
        const answerEl = el.querySelector('.answer');
        renderAnswerWithImages(answerEl, text || '', imageUrls || []);

      scrollToBottom();
    }

    function addBotMsgSkeleton(){
      const id = 'bot-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">金融智脑</div>
          <div style="min-width: 180px;">
            <div class="bubble">
              <span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
              <details class="progress" open>
                <summary>阶段进度（等待中）</summary>
                <ul></ul>
              </details>
            </div>
            <div class="meta">${nowTime()}</div>
          </div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
      return document.getElementById(id);
    }

    function renderProgress(botMsgEl, doneList, runningList, status){
      const details = botMsgEl.querySelector('details.progress');
      const summary = details.querySelector('summary');
      const ul = details.querySelector('ul');
      const done = Array.isArray(doneList) ? doneList : [];
      const running = Array.isArray(runningList) ? runningList : [];
      const totalDone = done.length;
      const totalRun = running.length;

      const statusMap = {
        'processing': '处理中',
        'completed': '已完成',
        'failed': '失败',
        'pending': '等待中',
      };
      const displayStatus = statusMap[status] || status || 'unknown';

      summary.textContent = `阶段进度（已完成${totalDone}，进行中${totalRun}，状态：${displayStatus}）`;

      const lines = [
        ...done.map(x => `✅ ${x}`),
        ...running.map(x => `⏳ ${x}`)
      ];
      ul.innerHTML = '';
      if(lines.length === 0){
        ul.insertAdjacentHTML('beforeend', '<li>暂无进度</li>');
      }else{
        for(const line of lines){
          ul.insertAdjacentHTML('beforeend', `<li>${escapeHtml(line)}</li>`);
        }
      }
    }

    function finalizeBotAnswer(botMsgEl, answer, error, imageUrls){
      const bubble = botMsgEl.querySelector('.bubble');
      const progress = botMsgEl.querySelector('details.progress');
      const err = (error || '').trim();

      if(err){
        const progressEl = progress ? progress : null;
        if(progressEl) {
            progressEl.remove();
            progressEl.removeAttribute('open');
        }
        bubble.textContent = '';
        const errEl = document.createElement('div');
        errEl.className = 'answer';
        errEl.textContent = `抱歉，本次处理失败：\n${err}`;
        bubble.appendChild(errEl);
        if(progressEl) bubble.appendChild(progressEl);
        return;
      }

      const progressEl = progress ? progress : null;
      if(progressEl) {
        progressEl.remove();
        progressEl.removeAttribute('open');
      }
      bubble.textContent = '';
      const answerEl = document.createElement('div');
      answerEl.className = 'answer';
      bubble.appendChild(answerEl);
      renderAnswerWithImages(answerEl, answer || '', imageUrls || []);
      if(progressEl) bubble.appendChild(progressEl);
    }

    async function apiHealth(){
      try{
        const res = await fetch(`${API_BASE}/health`);
        if(!res.ok) throw new Error('health not ok');
        apiPill.textContent = `API: 已连接`;
      }catch(e){
        apiPill.textContent = `API: 未连接`;
      }
    }

    async function loadHistory(targetId){
      const sid = targetId || sessionId;
      try{
        const res = await fetch(`${API_BASE}/history/${sid}`);
        if(!res.ok) return;
        const data = await res.json();
        const items = Array.isArray(data.items) ? data.items : [];
        if(items.length === 0) return;
        const nodes = Array.from(chatEl.querySelectorAll('.msg'));
        for(let i=1;i<nodes.length;i++) nodes[i].remove();
        items.reverse();
        for(const item of items){
          if(item.role === 'user'){
            addUserMsgWithTime(item.text || '', item.ts);
          }else{
            addBotMsgWithTime(item.text || '', item.ts, item.image_urls || []);
          }
        }
        scrollToBottom();
      }catch(_){}
    }

    async function submitQuery(text){
      const isStream = streamToggle.checked;
      const res = await fetch(`${API_BASE}/query`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          query: text,
          session_id: sessionId,
          is_stream: isStream
        })
      });
      if(!res.ok){
        const msg = await res.text();
        throw new Error(msg || '请求失败');
      }
      return await res.json();
    }

    async function poll(taskId, botMsgEl){
      const typing = botMsgEl.querySelector('.typing');
      const interval = setInterval(async () => {
        try{
          const res = await fetch(`${API_BASE}/status/${taskId}`);
          const data = await res.json();
          renderProgress(botMsgEl, data.done_list, data.running_list, data.status);

          if(data.status === 'completed'){
            if(typing) typing.remove();
            finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
            clearInterval(interval);
            sendBtn.disabled = false;
          }else if(data.status === 'failed'){
            if(typing) typing.remove();
            finalizeBotAnswer(botMsgEl, data.answer, data.error || 'failed', data.image_urls || []);
            clearInterval(interval);
            sendBtn.disabled = false;
          }
        }catch(e){}
      }, 1200);
    }

    async function onSend(){
      console.log('[perf] A onSend start', performance.now());
      const text = (inputEl.value || '').trim();
      if(!text) return;
      inputEl.value = '';
      inputEl.style.height = 'auto';
      autoIndexSession(text);
      addUserMsg(text);
      const botMsgEl = addBotMsgSkeleton();
      sendBtn.disabled = true;

      try{
        const isStream = streamToggle.checked;
        console.log('[perf] B submitQuery start', performance.now(), { isStream });
        const data = await submitQuery(text);
        console.log('[perf] B submitQuery end', performance.now(), data);
        
        renderProgress(botMsgEl, [], [], 'pending');

        if (!isStream) {
          renderProgress(botMsgEl, data.done_list || [], [], 'completed');
          finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
          sendBtn.disabled = false;
          return;
        }

        const { session_id } = data;
        
        const bubble = botMsgEl.querySelector('.bubble');
        let answerEl = bubble.querySelector('.answer');
        if(!answerEl){
          answerEl = document.createElement('div');
          answerEl.className = 'answer';
          bubble.insertBefore(answerEl, bubble.firstChild);
        }

        const es = new EventSource(`${API_BASE}/stream/${session_id}`);
        console.log('[perf] C EventSource created', performance.now(), { session_id });
        let rawAnswerText = '';

        es.addEventListener('progress', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            renderProgress(botMsgEl, d.done_list, d.running_list, d.status);
            if(d && d.status === 'completed'){
              const typing = botMsgEl.querySelector('.typing');
              if(typing) typing.remove();
              sendBtn.disabled = false;
            }
          }catch(_){}
        });

        es.addEventListener('delta', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            const delta = d.delta || '';
            if(delta){
              rawAnswerText += delta;
              renderAnswerWithImages(answerEl, rawAnswerText, []);
              scrollToBottom();
            }
          }catch(_){}
        });

        es.addEventListener('final', (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');
          
          try{
            const d = JSON.parse(e.data || '{}');
            const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0) ? d.answer : (rawAnswerText || answerEl.textContent || '');
            renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
          }catch(_){}
          es.close();
          sendBtn.disabled = false;
        });

        es.addEventListener('final_answer', (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');
          
          try{
            const d = JSON.parse(e.data || '{}');
            const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0) ? d.answer : (rawAnswerText || answerEl.textContent || '');
            renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
          }catch(_){}
          es.close();
          sendBtn.disabled = false;
        });

        es.addEventListener('error', (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');

          try{
            const msg = e && e.data ? (JSON.parse(e.data).error || 'SSE 连接中断/失败') : 'SSE 连接中断/失败';
            rawAnswerText += `\n\n（错误：${msg}）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }catch(_){
            rawAnswerText += `\n\n（错误：SSE 连接中断/失败）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }
          es.close();
          sendBtn.disabled = false;
        });
      }catch(e){
        const bubble = botMsgEl.querySelector('.bubble');
        const progress = botMsgEl.querySelector('details.progress');
        const typing = botMsgEl.querySelector('.typing');
        if(typing) typing.remove();
        bubble.innerHTML = `请求失败：${escapeHtml(e.message || e)}\n\n` + progress.outerHTML;
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', onSend);
    inputEl.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        onSend();
      }
    });
    btnClear.addEventListener('click', async () => {
      if(!confirm('确定要清空当前会话的历史记录吗？这将无法恢复。')) return;

      try {
        const res = await fetch(`${API_BASE}/history/${sessionId}`, { method: 'DELETE' });
        if(!res.ok) {
           console.error("Failed to clear history backend, status:", res.status);
           alert('服务端清空失败，仅清空本地显示');
        }
      } catch(e) {
        console.error("Failed to clear history backend", e);
        alert('服务端清空失败，仅清空本地显示');
      }

      resetChatView();
    });

    apiHealth();
    setInterval(apiHealth, 5000);
    renderSessionList();
    updateSubTitle();
    loadHistory(sessionId);
    setTimeout(() => inputEl.focus(), 200);
  </script>
</body>
</html>
