<!-- 查询演示页面，用于体验普通问答与流式响应（Google Gemini 原生极简版） -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>金融智脑</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-surface: #ffffff;
      --bg-sidebar: #f0f4f9;
      --bg-container: #f0f4f9;
      --bg-container-hover: #e1e5ea;
      --bg-active-pill: #d3e3fd;
      --text-primary: #1f1f1f;
      --text-secondary: #444746;
      --text-muted: #747775;
      --google-blue: #0b57d0;
      --border-hairline: #e3e3e3;
      --font-sans: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-sans);
      background-color: var(--bg-surface);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .app-layout {
      width: 100vw;
      height: 100vh;
      display: flex;
      overflow: hidden;
      background: var(--bg-surface);
    }

    /* ==========================================
       左侧抽屉：純正 Gemini 无边框浅灰蓝底色
       ========================================== */
    .sidebar {
      width: 268px;
      height: 100%;
      background: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: margin-left 0.28s cubic-bezier(0.2, 0, 0, 1);
      z-index: 30;
      user-select: none;
      padding: 12px 12px 14px;
    }

    .sidebar.collapsed {
      margin-left: -268px;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
      padding: 0 4px;
      margin-bottom: 12px;
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s ease;
      flex-shrink: 0;
    }

    .btn-icon:hover {
      background-color: rgba(68, 71, 70, 0.08);
      color: var(--text-primary);
    }

    .sidebar-action-wrap {
      padding: 0 4px 16px;
    }

    /* Gemini 标志性的胶囊新建按钮 */
    .btn-new-chat {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      height: 40px;
      padding: 0 16px 0 14px;
      border-radius: 999px;
      background: #dde3ea;
      border: none;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
      font-family: inherit;
    }

    .btn-new-chat:hover {
      background: #d0d7de;
      color: var(--text-primary);
    }

    .sidebar-section-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      padding: 0 12px 8px;
    }

    .session-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .session-list::-webkit-scrollbar {
      width: 4px;
    }
    .session-list::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.12);
      border-radius: 999px;
    }

    /* 单行胶囊式历史记录条目 */
    .session-item {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: background-color 0.12s ease;
      color: var(--text-secondary);
      position: relative;
    }

    .session-item:hover {
      background: rgba(68, 71, 70, 0.08);
      color: var(--text-primary);
    }

    .session-item.active {
      background: var(--bg-active-pill);
      color: #041e49;
      font-weight: 500;
    }

    .session-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: inherit;
      opacity: 0.8;
    }

    .session-info {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .session-title {
      font-size: 13.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1;
      color: inherit;
    }

    .session-time {
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .session-item:hover .session-time {
      display: none;
    }

    .session-actions {
      display: none;
      align-items: center;
      gap: 2px;
    }

    .session-item:hover .session-actions {
      display: flex;
    }

    .btn-session-action {
      background: transparent;
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      padding: 0;
    }

    .btn-session-action:hover {
      background: rgba(0, 0, 0, 0.08);
      color: var(--text-primary);
    }

    .session-empty {
      padding: 32px 12px;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .sidebar-footer {
      padding: 12px 12px 0;
      margin-top: 8px;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }

    .btn-clear-all-sessions {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      font-family: inherit;
    }

    .btn-clear-all-sessions:hover {
      background: rgba(68, 71, 70, 0.08);
      color: #b3261e;
    }

    /* ==========================================
       主工作区与无边框顶栏
       ========================================== */
    .app {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg-surface);
      position: relative;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      padding: 0 20px;
      background: var(--bg-surface);
      z-index: 20;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .sidebar:not(.collapsed) ~ .app .btn-toggle-sidebar {
      display: none;
    }

    .title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
      padding-left: 4px;
    }

    .title strong {
      font-size: 18px;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    .title span {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }

    .stream-label {
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 8px;
      transition: background 0.15s ease;
    }

    .stream-label:hover {
      background: var(--bg-container);
    }

    .stream-label input[type="checkbox"] {
      accent-color: var(--google-blue);
      width: 14px;
      height: 14px;
      margin: 0;
      cursor: pointer;
    }

    .pill {
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--bg-container);
      padding: 5px 12px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .pill::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #146c2e;
    }

    .btn {
      border: 1px solid var(--border-hairline);
      background: transparent;
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
      font-family: inherit;
    }

    .btn:hover {
      background: var(--bg-container);
      color: var(--text-primary);
    }

    /* ==========================================
       对话流区域
       ========================================== */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px 32px;
      scroll-behavior: smooth;
    }

    .chat::-webkit-scrollbar {
      width: 6px;
    }
    .chat::-webkit-scrollbar-thumb {
      background: #e1e5ea;
      border-radius: 999px;
    }

    .dayline {
      display: none;
    }

    .msg {
      display: flex;
      gap: 18px;
      margin: 28px auto;
      max-width: 780px;
      align-items: flex-start;
    }

    .msg.user {
      justify-content: flex-end;
    }

    .msg > div:not(.avatar) {
      flex: 1;
      min-width: 0;
    }

    .msg.user > div:not(.avatar) {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    /* 隐藏用户的“我”字头像，与原版 Gemini 保持一致 */
    .msg.user .avatar {
      display: none;
    }

    /* 机器人头像：纯正 Gemini 四角星图标，无底色圆圈 */
    .avatar.bot {
      width: 28px;
      height: 28px;
      border-radius: 0;
      background: transparent;
      font-size: 0;
      flex: 0 0 28px;
      margin-top: 4px;
      background-image: url("data:image/svg+xml,%3Csvg width='28' height='28' viewBox='0 0 28 28' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M14 28C14 21.75 9.52 14 0 14C9.52 14 14 6.25 14 0C14 6.25 18.48 14 28 14C18.48 14 14 21.75 14 28Z' fill='url(%23g)'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='28' y2='28' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%234285F4'/%3E%3Cstop offset='0.5' stop-color='%239B72CB'/%3E%3Cstop offset='1' stop-color='%23D96570'/%3E%3C/linearGradient%3E%3C/defs%3E%3C/svg%3E");
      background-size: 22px 22px;
      background-repeat: no-repeat;
      background-position: center;
    }

    .bubble {
      max-width: 100%;
      display: block;
      padding: 2px 0;
      background: transparent;
      color: var(--text-primary);
      position: relative;
      line-height: 1.75;
      font-size: 15.5px;
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    /* 用户消息胶囊：Gemini 标准浅灰蓝圆角块 */
    .msg.user .bubble {
      display: inline-block;
      background: var(--bg-container);
      color: var(--text-primary);
      padding: 12px 20px;
      border-radius: 24px;
      max-width: min(600px, 85%);
      font-size: 15px;
      line-height: 1.6;
    }

    .meta {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* ==========================================
       首屏欢迎区：去气泡化，采用 Gemini 卡片网格
       ========================================== */
    .welcome-hero {
      white-space: normal;
      padding: 12px 0 8px;
    }

    .welcome-greeting {
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.5px;
      color: #1f1f1f;
      margin: 0 0 8px 0;
      line-height: 1.3;
    }

    .welcome-sub {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.65;
      margin: 0 0 24px 0;
      max-width: 680px;
    }

    .prompt-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }

    .pill-btn {
      border: none;
      background: var(--bg-container);
      color: var(--text-primary);
      font-size: 13.5px;
      line-height: 1.5;
      padding: 16px;
      border-radius: 16px;
      cursor: pointer;
      transition: background-color 0.15s ease;
      text-align: left;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 96px;
    }

    .pill-btn:hover {
      background: var(--bg-container-hover);
    }

    .pill-btn-tag {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 12px;
      font-weight: 500;
    }

    /* ==========================================
       思考进度（Gemini 思考折叠栏）
       ========================================== */
    details.progress {
      margin: 4px 0 14px;
      border: 1px solid var(--border-hairline);
      border-radius: 12px;
      padding: 8px 14px;
      background: var(--bg-surface);
      white-space: normal;
      max-width: 520px;
    }

    details.progress summary {
      cursor: pointer;
      user-select: none;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      outline: none;
    }

    .progress ul {
      margin: 8px 0 2px 0;
      padding: 0;
      list-style: none;
    }

    .progress li {
      margin: 4px 0;
      font-size: 12.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ==========================================
       五段式结构标题：克制的现代研报排版，无 Emoji
       ========================================== */
    .fin-badge {
      display: block;
      font-weight: 600;
      font-size: 14px;
      color: var(--text-primary);
      margin-top: 18px;
      margin-bottom: 6px;
      padding-left: 10px;
      border-left: 3px solid var(--google-blue);
      line-height: 1.4;
    }

    .fin-badge.conclusion { border-left-color: #0b57d0; }
    .fin-badge.details { border-left-color: #137333; }
    .fin-badge.risk { border-left-color: #e37400; }
    .fin-badge.source { border-left-color: #747775; }
    .fin-badge.disclaimer {
      border-left-color: #c5221f;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .answer-text {
      line-height: 1.75;
      font-size: 15.5px;
      color: var(--text-primary);
    }

    .answer-images {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .answer-images img {
      display: block;
      max-width: min(100%, 580px);
      max-height: 580px;
      width: auto;
      height: auto;
      border-radius: 12px;
      border: 1px solid var(--border-hairline);
      background: #fff;
    }

    .answer-images a {
      font-size: 12px;
      color: var(--google-blue);
      text-decoration: none;
      word-break: break-all;
    }

    .typing {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      padding: 8px 0;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #747775;
      animation: pulse 1.2s infinite ease-in-out;
    }

    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.3s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.25; }
      40% { opacity: 0.9; }
    }

    /* ==========================================
       底部输入区：Gemini 悬浮大胶囊
       ========================================== */
    .composer-container {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 0 24px 16px;
      background: var(--bg-surface);
    }

    .composer {
      background: var(--bg-container);
      border-radius: 28px;
      padding: 10px 12px 10px 22px;
      display: flex;
      gap: 12px;
      align-items: flex-end;
      transition: background-color 0.2s ease;
    }

    .composer:focus-within {
      background: #e9eef6;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 36px;
      max-height: 160px;
      padding: 6px 0;
      border: none;
      background: transparent;
      outline: none;
      font-size: 15.5px;
      line-height: 1.5;
      color: var(--text-primary);
      font-family: inherit;
    }

    textarea::placeholder {
      color: var(--text-muted);
    }

    .send {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      color: #ffffff;
      background: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s ease, background-color 0.15s ease;
      flex-shrink: 0;
    }

    .send:hover:not(:disabled) {
      background: var(--google-blue);
    }

    .send:disabled {
      background: transparent;
      color: #b0b5ba;
      cursor: not-allowed;
    }

    .hint {
      text-align: center;
      padding-top: 10px;
      color: var(--text-muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- 左侧历史会话抽屉 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="btn-icon" id="btnCollapseSidebar" title="收起菜单">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="sidebar-action-wrap">
        <button class="btn-new-chat" id="btnNewChat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>发起新对话</span>
        </button>
      </div>

      <div class="sidebar-section-label">近期对话</div>

      <div class="session-list" id="sessionList">
        <!-- 动态渲染历史会话条目 -->
      </div>

      <div class="sidebar-footer">
        <span id="sessionCount">共 0 个会话</span>
        <button class="btn-clear-all-sessions" id="btnClearAllSessions" title="清空所有历史会话">清空全部</button>
      </div>
    </aside>

    <div class="app">
      <div class="topbar">
        <div class="brand">
          <button class="btn-icon btn-toggle-sidebar" id="btnToggleSidebar" title="展开菜单">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="title">
            <strong>金融智脑</strong>
            <span id="subTitle">智能合规问答</span>
          </div>
        </div>
        <div class="top-actions">
          <label class="stream-label">
            <input type="checkbox" id="streamToggle" checked> 流式输出
          </label>
          <span class="pill" id="apiPill">API: 未连接</span>
          <button class="btn" id="btnClear" title="清空当前会话的历史对话">清空对话</button>
        </div>
      </div>

      <div class="chat" id="chat">
        <div class="dayline">今天</div>
        <div class="msg bot">
          <div class="avatar bot">金融智脑</div>
          <div>
            <div class="bubble">
              <div class="welcome-hero">
                <h2 class="welcome-greeting">您好，请问需要检索哪项金融合规资料？</h2>
                <p class="welcome-sub">基于已收录的上市公司财报、基金产品概要、银行理财风险揭示书、宏观经济公报及投教知识库，提供客观、可溯源的合规解答。</p>
                <div class="prompt-grid">
                  <button class="pill-btn" onclick="fillInput('贵州茅台酒股份有限公司2026年第一季度营业收入和净利润分别是多少？')">
                    <span>贵州茅台 2026 一季报营业收入与净利润数据</span>
                    <span class="pill-btn-tag">上市公司财报</span>
                  </button>
                  <button class="pill-btn" onclick="fillInput('华夏国证自由现金流ETF发起式联接基金的风险等级是什么？投资范围包含哪些？')">
                    <span>华夏自由现金流 ETF 联接基金风险等级与投资范围</span>
                    <span class="pill-btn-tag">基金产品概要</span>
                  </button>

                    <span>基金最大回撤、单位净值与累计净值的核心区别</span>

                    <span>私募基金合格投资者资产认定门槛与起投金额</span>

  <script>
    const API_BASE = location.origin.startsWith('http') ? location.origin : 'http://127.0.0.1:8001';
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const apiPill = document.getElementById('apiPill');
    const btnClear = document.getElementById('btnClear');
    const streamToggle = document.getElementById('streamToggle');

    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
    });

    const SESSIONS_KEY = 'finance_brain_sessions';
    const ACTIVE_KEY = 'finance_brain_active_session';
    const COLLAPSED_KEY = 'finance_brain_sidebar_collapsed';

    const sidebarEl = document.getElementById('sidebar');
    const btnToggleSidebar = document.getElementById('btnToggleSidebar');
    const btnCollapseSidebar = document.getElementById('btnCollapseSidebar');
    const btnNewChat = document.getElementById('btnNewChat');
    const sessionListEl = document.getElementById('sessionList');
    const sessionCountEl = document.getElementById('sessionCount');
    const btnClearAllSessions = document.getElementById('btnClearAllSessions');
    const subTitleEl = document.getElementById('subTitle');

    if (localStorage.getItem(COLLAPSED_KEY) === 'true') {
      sidebarEl.classList.add('collapsed');
    }
    function toggleSidebar() {
      const isCollapsed = sidebarEl.classList.toggle('collapsed');
      localStorage.setItem(COLLAPSED_KEY, isCollapsed ? 'true' : 'false');
    }
    if (btnToggleSidebar) btnToggleSidebar.addEventListener('click', toggleSidebar);
    if (btnCollapseSidebar) btnCollapseSidebar.addEventListener('click', toggleSidebar);

    function getStoredSessions() {
      try {
        const raw = localStorage.getItem(SESSIONS_KEY);
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        return [];
      }
    }

    function saveStoredSessions(list) {
      localStorage.setItem(SESSIONS_KEY, JSON.stringify(list));
    }

    function formatRelativeTime(ts) {
      if (!ts) return '刚刚';
      const now = Date.now();
      const diff = Math.floor((now - ts) / 1000);
      if (diff < 60) return '刚刚';
      if (diff < 3600) return `${Math.floor(diff / 60)}分钟前`;
      
      const d = new Date(ts);
      const today = new Date();
      if (d.toDateString() === today.toDateString()) {
        return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      }
      return `${(d.getMonth() + 1).toString().padStart(2, '0')}-${d.getDate().toString().padStart(2, '0')}`;
    }

    let sessions = getStoredSessions();

    const urlParams = new URLSearchParams(window.location.search);
    const queryUser = urlParams.get('user') || urlParams.get('session');
    let sessionId = "";

    if (queryUser) {
      sessionId = queryUser.startsWith("sess-") || queryUser.startsWith("user_") ? queryUser : `user_${queryUser}`;
      let found = sessions.find(s => s.id === sessionId);
      if (!found) {
        found = {
          id: sessionId,
          title: `用户 ${queryUser} 对话`,
          createdAt: Date.now(),
          updatedAt: Date.now()
        };
        sessions.unshift(found);
        saveStoredSessions(sessions);
      }
    } else {
      const savedActive = localStorage.getItem(ACTIVE_KEY) || sessionStorage.getItem('kb_session_id');
      if (savedActive && sessions.some(s => s.id === savedActive)) {
        sessionId = savedActive;
      } else if (sessions.length > 0) {
        sessionId = sessions[0].id;
      } else {
        sessionId = 'sess-' + Math.random().toString(36).slice(2, 8) + '-' + Date.now().toString(36);
        sessions.unshift({
          id: sessionId,
          title: '新对话',
          createdAt: Date.now(),
          updatedAt: Date.now()
        });
        saveStoredSessions(sessions);
      }
    }

    localStorage.setItem(ACTIVE_KEY, sessionId);
    sessionStorage.setItem('kb_session_id', sessionId);

    function updateSubTitle(title) {
      if (!subTitleEl) return;
      const display = title || (sessions.find(s => s.id === sessionId)?.title) || '新对话';
      subTitleEl.textContent = display;
    }

    function renderSessionList() {
      if (!sessionListEl) return;
      sessionListEl.innerHTML = '';

      if (sessions.length === 0) {
        sessionListEl.innerHTML = '<div class="session-empty">暂无对话记录</div>';
        if (sessionCountEl) sessionCountEl.textContent = '共 0 个会话';
        return;
      }

      if (sessionCountEl) sessionCountEl.textContent = `共 ${sessions.length} 个会话`;

      sessions.forEach(item => {
        const itemEl = document.createElement('div');
        const isActive = item.id === sessionId;
        itemEl.className = `session-item ${isActive ? 'active' : ''}`;
        itemEl.setAttribute('data-id', item.id);
        itemEl.title = item.title || '新对话';

        itemEl.innerHTML = `
          <div class="session-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
          </div>
          <div class="session-info">
            <div class="session-title">${escapeHtml(item.title || '新对话')}</div>
            <div class="session-time">${formatRelativeTime(item.updatedAt || item.createdAt)}</div>
          </div>
          <div class="session-actions">
            <button class="btn-session-action btn-rename" title="重命名">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
              </svg>
            </button>
            <button class="btn-session-action btn-delete" title="删除">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </div>
        `;

        itemEl.addEventListener('click', (e) => {
          if (e.target.closest('.btn-session-action')) return;
          if (item.id === sessionId) return;
          switchSession(item.id);
        });

        const btnRename = itemEl.querySelector('.btn-rename');
        btnRename.addEventListener('click', (e) => {
          e.stopPropagation();
          const newTitle = prompt('请输入新会话名称：', item.title || '新对话');
          if (newTitle && newTitle.trim() && newTitle.trim() !== item.title) {
            item.title = newTitle.trim();
            item.updatedAt = Date.now();
            saveStoredSessions(sessions);
            renderSessionList();
            if (item.id === sessionId) updateSubTitle(item.title);
          }
        });

        const btnDelete = itemEl.querySelector('.btn-delete');
        btnDelete.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!confirm(`确定要删除会话「${item.title || '新对话'}」吗？历史消息将全部清除。`)) return;
          
          try {
            fetch(`${API_BASE}/history/${item.id}`, { method: 'DELETE' }).catch(() => {});
          } catch (_) {}

          sessions = sessions.filter(s => s.id !== item.id);
          saveStoredSessions(sessions);

          if (item.id === sessionId) {
            if (sessions.length > 0) {
              switchSession(sessions[0].id);
            } else {
              createNewSession();
            }
          } else {
            renderSessionList();
          }
        });

        sessionListEl.appendChild(itemEl);
      });
    }

    async function switchSession(newId) {
      sessionId = newId;
      localStorage.setItem(ACTIVE_KEY, sessionId);
      sessionStorage.setItem('kb_session_id', sessionId);
      
      const curr = sessions.find(s => s.id === sessionId);
      updateSubTitle(curr ? curr.title : '新对话');
      renderSessionList();
      resetChatView();
      await loadHistory(sessionId);
    }

    function createNewSession() {
      const newId = 'sess-' + Math.random().toString(36).slice(2, 8) + '-' + Date.now().toString(36);
      const newSession = {
        id: newId,
        title: '新对话',
        createdAt: Date.now(),
        updatedAt: Date.now()
      };
      sessions.unshift(newSession);
      saveStoredSessions(sessions);

      sessionId = newId;
      localStorage.setItem(ACTIVE_KEY, sessionId);
      sessionStorage.setItem('kb_session_id', sessionId);

      if (window.location.search) {
        window.history.replaceState({}, '', window.location.pathname);
      }

      resetChatView();
      renderSessionList();
      updateSubTitle('新对话');
      inputEl.focus();
    }

    if (btnNewChat) {
      btnNewChat.addEventListener('click', createNewSession);
    }

    if (btnClearAllSessions) {
      btnClearAllSessions.addEventListener('click', async () => {
        if (!confirm('确定要清空全部本地历史会话记录吗？')) return;
        for (const s of sessions) {
          try {
            fetch(`${API_BASE}/history/${s.id}`, { method: 'DELETE' }).catch(() => {});
          } catch (_) {}
        }
        sessions = [];
        saveStoredSessions(sessions);
        createNewSession();
      });
    }

    function autoIndexSession(queryText) {
      if (!queryText) return;
      let curr = sessions.find(s => s.id === sessionId);
      if (!curr) {
        curr = {
          id: sessionId,
          title: '新对话',
          createdAt: Date.now(),
          updatedAt: Date.now()
        };
        sessions.unshift(curr);
      }

      if (curr.title === '新对话' || !curr.title || curr.title.startsWith('sess-')) {
        const clean = queryText.replace(/[\r\n]+/g, ' ').trim();
        curr.title = clean.length > 22 ? clean.slice(0, 22) + '...' : clean;
      }
      curr.updatedAt = Date.now();
      
      sessions = [curr, ...sessions.filter(s => s.id !== sessionId)];
      saveStoredSessions(sessions);
      renderSessionList();
      updateSubTitle(curr.title);
    }

    function resetChatView() {
      const nodes = Array.from(chatEl.querySelectorAll('.msg'));
      for (let i = 1; i < nodes.length; i++) nodes[i].remove();
      scrollToBottom();
    }

    function scrollToBottom(){
      chatEl.scrollTop = chatEl.scrollHeight;
    }
    function nowTime(){
      const d = new Date();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function formatTime(ts){
      if(!ts) return nowTime();
      const d = new Date(Number(ts) * 1000);
      if(Number.isNaN(d.getTime())) return nowTime();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    function fillInput(queryText){
      if(!queryText) return;
      const el = document.getElementById('input');
      if(el){
        el.value = queryText;
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 160) + 'px';
        el.focus();
      }
    }

    function formatFinancialAnswerHtml(rawText){
      if(!rawText) return '';
      let html = escapeHtml(rawText);

      html = html.replace(/【简要结论】/g, '<div class="fin-badge conclusion">简要结论</div>');
      html = html.replace(/【详细解析】/g, '<div class="fin-badge details">详细解析</div>');
      html = html.replace(/【风险提示(?:\/注意事项)?】|【风险提示】|【注意事项】/g, '<div class="fin-badge risk">风险提示与注意事项</div>');
      html = html.replace(/【引用来源】/g, '<div class="fin-badge source">引用来源</div>');
      html = html.replace(/【合规免责声明】/g, '<div class="fin-badge disclaimer">合规免责声明</div>');

      html = html.replace(/\n\n/g, '<br/><br/>').replace(/\n/g, '<br/>');
      return html;
    }

    function isImageUrl(url){
      try {
        const u = new URL(url);
        return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.pathname);
      } catch (e) {
        return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || '');
      }
    }

    function normalizeUrl(rawUrl){
      const s = String(rawUrl || '').trim();
      if(!s) return '';
      return s.replace(/\s/g, '%20');
    }

    function dedupeKeepOrder(arr){
      const seen = new Set();
      const out = [];
      for(const x of (Array.isArray(arr) ? arr : [])){
        const v = String(x || '');
        if(!v) continue;
        if(seen.has(v)) continue;
        seen.add(v);
        out.push(v);
      }
      return out;
    }

    function extractUrlsLoose(text){
      const s = String(text || '');
      const regex = /(https?:\/\/[^\s]+)/g;
      const matches = s.match(regex) || [];
      const urls = [];
      
      const trimTailPunct = (u) => String(u || '').replace(/[)\]}'">，。,;；\]】）＞]+$/g, '');
      const trimHeadPunct = (u) => String(u || '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '');

      for(const m of matches){
        let u = trimHeadPunct(trimTailPunct(m));
        if(u) urls.push(u);
      }
      return dedupeKeepOrder(urls);
    }

    function parseImagesFromTextLoosely(text){
      const urls = extractUrlsLoose(text).filter(isImageUrl);
      return dedupeKeepOrder(urls);
    }

    function findLastImageMarkerIndex(raw){
      const s = String(raw || '');
      const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
      let m;
      let lastIdx = -1;
      let lastLen = 0;
      while((m = re.exec(s)) !== null){
        lastIdx = m.index;
        lastLen = m[0].length;
      }
      return { idx: lastIdx, len: lastLen };
    }

    function parseAnswerAndImages(text){
      const raw = String(text || '');
      const { idx, len } = findLastImageMarkerIndex(raw);
      if(idx === -1) return { text: raw, images: [] };

      const before = raw.slice(0, idx).trimEnd();
      const after = raw.slice(idx + len).trim();
      const urls = [];

      const lines = after.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      for(const line of lines){
        if(line.startsWith('http://') || line.startsWith('https://')){
          urls.push(line);
        }else{
          const matches = extractUrlsLoose(line);
          for(const u of matches){
            urls.push(u);
          }
        }
      }

      const seen = new Set();
      const images = [];
      for(const u of urls){
        const normalized = normalizeUrl(u);
        if(!isImageUrl(normalized)) continue;
        if(seen.has(normalized)) continue;
        seen.add(normalized);
        images.push(normalized);
      }
      return { text: before, images };
    }

    function shouldShowImagesByAnswer(answerText){
      const t = String(answerText || '');
      const keywords = [
        '如图', '如下图', '见图', '见下图', '下图', '上图',
        '图片', '示意图', '结构图', '外观', '接线图', '电路图', '原理图', '安装图', '尺寸图', '截图'
      ];
      return keywords.some(k => t.includes(k));
    }

    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls){
      const { text, images: imagesFromBlock } = parseAnswerAndImages(answerText);
      const candidates = Array.isArray(candidateImageUrls)
        ? candidateImageUrls.map(normalizeUrl).filter(isImageUrl)
        : [];
      const hasBlockImages = imagesFromBlock && imagesFromBlock.length > 0;
      const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);
      
      const allImages = new Set([
          ...(hasBlockImages ? imagesFromBlock : []),
          ...candidates,
          ...looseImages
      ]);
      const images = Array.from(allImages);

      containerEl.textContent = '';

      if((text || '').trim().length > 0){
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.innerHTML = formatFinancialAnswerHtml(text);
        containerEl.appendChild(textEl);
      }else{
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.textContent = '（已完成，但未返回答案）';
        containerEl.appendChild(textEl);
      }

      if(images && images.length > 0){
        const imgWrap = document.createElement('div');
        imgWrap.className = 'answer-images';
        for(const url of images){
          const safeUrl = normalizeUrl(url);
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.src = safeUrl;
          img.alt = '参考图片';
          img.referrerPolicy = 'no-referrer';
          img.addEventListener('error', () => {
            img.style.display = 'none';
          });
          imgWrap.appendChild(img);

          const link = document.createElement('a');
          link.href = safeUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = url;
          imgWrap.appendChild(link);
        }
        containerEl.appendChild(imgWrap);
      }
    }

    function addUserMsg(text){
      const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${nowTime()}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addUserMsgWithTime(text, ts){
      const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addBotMsgWithTime(text, ts, imageUrls){
      const id = 'bot-his-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">金融智脑</div>
          <div>
            <div class="bubble"><div class="answer"></div></div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      const el = document.getElementById(id);
      if(el){
        const answerEl = el.querySelector('.answer');
        renderAnswerWithImages(answerEl, text || '', imageUrls || []);
      }
      scrollToBottom();
    }

    function addBotMsgSkeleton(){
      const id = 'bot-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">金融智脑</div>
          <div style="min-width: 180px;">
            <div class="bubble">
              <span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
              <details class="progress" open>
                <summary>思考与检索进度</summary>
                <ul></ul>
              </details>
            </div>
            <div class="meta">${nowTime()}</div>
          </div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
      return document.getElementById(id);
    }

    function renderProgress(botMsgEl, doneList, runningList, status){
      const details = botMsgEl.querySelector('details.progress');
      const summary = details.querySelector('summary');
      const ul = details.querySelector('ul');
      const done = Array.isArray(doneList) ? doneList : [];
      const running = Array.isArray(runningList) ? runningList : [];
      const totalDone = done.length;
      const totalRun = running.length;

      const statusMap = {
        'processing': '检索中',
        'completed': '已完成',
        'failed': '异常',
        'pending': '准备中',
      };
      const displayStatus = statusMap[status] || status || 'unknown';

      summary.textContent = `检索阶段（已完成 ${totalDone} 项 · ${displayStatus}）`;

      const lines = [
        ...done.map(x => `[完成] ${x}`),
        ...running.map(x => `[进行中] ${x}`)
      ];
      ul.innerHTML = '';
      if(lines.length === 0){
        ul.insertAdjacentHTML('beforeend', '<li>正在初始化检索管线...</li>');
      }else{
        for(const line of lines){
          ul.insertAdjacentHTML('beforeend', `<li>${escapeHtml(line)}</li>`);
        }
      }
    }

    function finalizeBotAnswer(botMsgEl, answer, error, imageUrls){
      const bubble = botMsgEl.querySelector('.bubble');
      const progress = botMsgEl.querySelector('details.progress');
      const err = (error || '').trim();

      if(err){
        const progressEl = progress ? progress : null;
        if(progressEl) {
            progressEl.remove();
            progressEl.removeAttribute('open');
        }
        bubble.textContent = '';
        const errEl = document.createElement('div');
        errEl.className = 'answer';
        errEl.textContent = `抱歉，本次处理失败：\n${err}`;
        bubble.appendChild(errEl);
        if(progressEl) bubble.appendChild(progressEl);
        return;
      }

      const progressEl = progress ? progress : null;
      if(progressEl) {
        progressEl.remove();
        progressEl.removeAttribute('open');
      }
      bubble.textContent = '';
      const answerEl = document.createElement('div');
      answerEl.className = 'answer';
      bubble.appendChild(answerEl);
      renderAnswerWithImages(answerEl, answer || '', imageUrls || []);
      if(progressEl) bubble.appendChild(progressEl);
    }

    async function apiHealth(){
      try{
        const res = await fetch(`${API_BASE}/health`);
        if(!res.ok) throw new Error('health not ok');
        apiPill.textContent = `API: 已连接`;
      }catch(e){
        apiPill.textContent = `API: 未连接`;
      }
    }

    async function loadHistory(targetId){
      const sid = targetId || sessionId;
      try{
        const res = await fetch(`${API_BASE}/history/${sid}`);
        if(!res.ok) return;
        const data = await res.json();
        const items = Array.isArray(data.items) ? data.items : [];
        if(items.length === 0) return;
        const nodes = Array.from(chatEl.querySelectorAll('.msg'));
        for(let i=1;i<nodes.length;i++) nodes[i].remove();
        items.reverse();
        for(const item of items){
          if(item.role === 'user'){
            addUserMsgWithTime(item.text || '', item.ts);
          }else{
            addBotMsgWithTime(item.text || '', item.ts, item.image_urls || []);
          }
        }
        scrollToBottom();
      }catch(_){}
    }

    async function submitQuery(text){
      const isStream = streamToggle.checked;
      const res = await fetch(`${API_BASE}/query`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          query: text,
          session_id: sessionId,
          is_stream: isStream
        })
      });
      if(!res.ok){
        const msg = await res.text();
        throw new Error(msg || '请求失败');
      }
      return await res.json();
    }

    async function poll(taskId, botMsgEl){
      const typing = botMsgEl.querySelector('.typing');
      const interval = setInterval(async () => {
        try{
          const res = await fetch(`${API_BASE}/status/${taskId}`);
          const data = await res.json();
          renderProgress(botMsgEl, data.done_list, data.running_list, data.status);

          if(data.status === 'completed'){
            if(typing) typing.remove();
            finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
            clearInterval(interval);
            sendBtn.disabled = false;
          }else if(data.status === 'failed'){
            if(typing) typing.remove();
            finalizeBotAnswer(botMsgEl, data.answer, data.error || 'failed', data.image_urls || []);
            clearInterval(interval);
            sendBtn.disabled = false;
          }
        }catch(e){}
      }, 1200);
    }

    async function onSend(){
      const text = (inputEl.value || '').trim();
      if(!text) return;
      inputEl.value = '';
      inputEl.style.height = 'auto';
      autoIndexSession(text);
      addUserMsg(text);
      const botMsgEl = addBotMsgSkeleton();
      sendBtn.disabled = true;

      try{
        const isStream = streamToggle.checked;
        const data = await submitQuery(text);
        
        renderProgress(botMsgEl, [], [], 'pending');

        if (!isStream) {
          renderProgress(botMsgEl, data.done_list || [], [], 'completed');
          finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
          sendBtn.disabled = false;
          return;
        }

        const { session_id } = data;
        
        const bubble = botMsgEl.querySelector('.bubble');
        let answerEl = bubble.querySelector('.answer');
        if(!answerEl){
          answerEl = document.createElement('div');
          answerEl.className = 'answer';
          bubble.insertBefore(answerEl, bubble.firstChild);
        }

        const es = new EventSource(`${API_BASE}/stream/${session_id}`);
        let rawAnswerText = '';

        es.addEventListener('progress', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            renderProgress(botMsgEl, d.done_list, d.running_list, d.status);
            if(d && d.status === 'completed'){
              const typing = botMsgEl.querySelector('.typing');
              if(typing) typing.remove();
              sendBtn.disabled = false;
            }
          }catch(_){}
        });

        es.addEventListener('delta', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            const delta = d.delta || '';
            if(delta){
              rawAnswerText += delta;
              renderAnswerWithImages(answerEl, rawAnswerText, []);
              scrollToBottom();
            }
          }catch(_){}
        });

        es.addEventListener('final', (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');
          
          try{
            const d = JSON.parse(e.data || '{}');
            const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0) ? d.answer : (rawAnswerText || answerEl.textContent || '');
            renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
          }catch(_){}
          es.close();
          sendBtn.disabled = false;
        });

        es.addEventListener('final_answer', (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');
          
          try{
            const d = JSON.parse(e.data || '{}');
            const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0) ? d.answer : (rawAnswerText || answerEl.textContent || '');
            renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
          }catch(_){}
          es.close();
          sendBtn.disabled = false;
        });

        es.addEventListener('error', (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');

          try{
            const msg = e && e.data ? (JSON.parse(e.data).error || 'SSE 连接中断/失败') : 'SSE 连接中断/失败';
            rawAnswerText += `\n\n（错误：${msg}）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }catch(_){
            rawAnswerText += `\n\n（错误：SSE 连接中断/失败）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }
          es.close();
          sendBtn.disabled = false;
        });
      }catch(e){
        const bubble = botMsgEl.querySelector('.bubble');
        const progress = botMsgEl.querySelector('details.progress');
        const typing = botMsgEl.querySelector('.typing');
        if(typing) typing.remove();
        bubble.innerHTML = `请求失败：${escapeHtml(e.message || e)}\n\n` + progress.outerHTML;
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', onSend);
    inputEl.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        onSend();
      }
    });
    btnClear.addEventListener('click', async () => {
      if(!confirm('确定要清空当前会话的历史记录吗？这将无法恢复。')) return;

      try {
        const res = await fetch(`${API_BASE}/history/${sessionId}`, { method: 'DELETE' });
        if(!res.ok) {
           alert('服务端清空失败，仅清空本地显示');
        }
      } catch(e) {
        alert('服务端清空失败，仅清空本地显示');
      }

      resetChatView();
    });

    apiHealth();
    setInterval(apiHealth, 5000);
    renderSessionList();
    updateSubTitle();
    loadHistory(sessionId);
    setTimeout(() => inputEl.focus(), 200);
  </script>
</body>
</html>
